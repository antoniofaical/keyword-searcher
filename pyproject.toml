[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keyword-searcher"
version = "0.1.0"
description = "Google queries to institutional website entrypoints"
requires-python = ">=3.11"
dependencies = ["beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[project.scripts]
keyword-searcher = "keyword_searcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
