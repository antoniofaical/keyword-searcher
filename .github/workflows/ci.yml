name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Bootstrap PowerShell (clean and repeated)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE 'bootstrap.ps1'
          Set-Location $env:RUNNER_TEMP
          & $script -PythonExecutable (Get-Command python).Source
          & $script
      - name: Bootstrap Bash (clean and repeated)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          bash "$GITHUB_WORKSPACE/bootstrap.sh" "$(command -v python)"
          bash "$GITHUB_WORKSPACE/bootstrap.sh"
