name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Copy checkout to a path with spaces
        run: python -c "import os, pathlib, shutil; shutil.copytree(os.environ['GITHUB_WORKSPACE'], pathlib.Path(os.environ['RUNNER_TEMP']) / 'keyword searcher', ignore=shutil.ignore_patterns('.git', '.venv'))"
      - name: Bootstrap PowerShell (clean and repeated)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $script = Join-Path $env:RUNNER_TEMP 'keyword searcher/bootstrap.ps1'
          Set-Location $env:RUNNER_TEMP
          & $script -PythonExecutable (Get-Command python).Source
          & $script
      - name: Bootstrap Bash (clean and repeated)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          bash "$RUNNER_TEMP/keyword searcher/bootstrap.sh" "$(command -v python)"
          bash "$RUNNER_TEMP/keyword searcher/bootstrap.sh"
